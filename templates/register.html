<!DOCTYPE html>
<html>
<head><title>Register - AIGS</title>
<style>
*{font-family:Arial}
body{background:linear-gradient(135deg,#667eea,#764ba2);height:100vh;display:flex;justify-content:center;align-items:center;margin:0}
.card{background:white;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.3);width:350px;text-align:center}
input{width:90%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px}
button{background:linear-gradient(90deg,#ff6a00,#ee0979);color:white;border:none;padding:12px 25px;border-radius:20px;width:100%;font-weight:bold;cursor:pointer}
a{color:#4e54c8;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<h1>Create Account - Smart City Portal</h1>
<form method="POST">
<input type="text" name="name" placeholder="Full Name" required><br>
<input type="email" name="email" placeholder="Email" required><br>
<input type="password" name="password" placeholder="Password" required><br>
<button type="submit">Register</button>
</form>
<p>Already have account? <a href="/login">Login</a></p>
<p><a href="/">Home</a></p>
</div>
</body>
</html>
