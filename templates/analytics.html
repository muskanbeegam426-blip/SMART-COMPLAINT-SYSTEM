<!DOCTYPE html>
<html>
<head>
<title>Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial;padding:20px;background:#f5f5f5}
.chart-box{width:30%;background:white;padding:20px;border-radius:10px;box-shadow:0 0 10px #ccc;display:inline-block;margin:10px;vertical-align:top}
</style>
</head>
<body>
<h2>📊 Smart City Analytics Dashboard</h2>
<a href="/admin" style="background:black;color:white;padding:8px 12px;text-decoration:none;border-radius:5px">Back to Admin</a>
<br><br>
<div class="chart-box"><h3>Urgency Wise</h3><canvas id="urgencyChart"></canvas></div>
<div class="chart-box"><h3>Status Wise</h3><canvas id="statusChart"></canvas></div>
<div class="chart-box"><h3>Type Wise</h3><canvas id="typeChart"></canvas></div>
<script>
const urgencyData = {{ urgency_data|tojson }};
const statusData = {{ status_data|tojson }};
const typeData = {{ type_data|tojson }};
new Chart(document.getElementById('urgencyChart'), { type: 'pie', data: { labels: urgencyData.map(x=>x[0]), datasets: [{ data: urgencyData.map(x=>x[1]), backgroundColor: ['red','orange','green'] }] } });
new Chart(document.getElementById('statusChart'), { type: 'bar', data: { labels: statusData.map(x=>x[0]), datasets: [{ label:'Count', data: statusData.map(x=>x[1]), backgroundColor: ['#f39c12','#8e44ad','#27ae60','#e74c3c'] }] } });
new Chart(document.getElementById('typeChart'), { type: 'doughnut', data: { labels: typeData.map(x=>x[0]), datasets: [{ data: typeData.map(x=>x[1]), backgroundColor: ['#3498db','#9b59b6','#1abc9c','#e67e22'] }] } });
</script>
</body>
</html>
