<!DOCTYPE html>
<html>
<head><title>Login - Smart City Portal</title>
<style>
*{font-family:Arial} body{background:linear-gradient(135deg,#667eea,#764ba2);height:100vh;display:flex;justify-content:center;align-items:center;margin:0}
.card{background:white;padding:30px;border-radius:20px;width:350px;text-align:center}
input{width:90%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ccc}
button{background:#667eea;color:white;border:none;padding:12px;width:95%;border-radius:10px;cursor:pointer}
.flash{background:#ffdddd;color:red;padding:8px;border-radius:8px;margin-bottom:10px}
</style></head>
<body>
<div class="card">
<h2>Smart City Portal - Login</h2>
{% with messages = get_flashed_messages() %}{% if messages %}{% for m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endif %}{% endwith %}
<form method="POST">
<input type="email" name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Password" required>
<button>Login</button>
</form>
<p>New? <a href="/register">Register Here</a></p>
<p style="font-size:12px">Citizen: muskaan@gmail.com / 123<br>Admin: admin@smartcity.com / admin123</p>
</div>
</body>
</html>
